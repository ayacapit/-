<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 | 在宁静中沉淀，于未知处破局</title>
    <!-- 引入 Swiper (轮播图) 和 FontAwesome (图标) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 替换原有的所有样式 */
:root {
    --primary-bg: #f8fafc;
    --nav-bg: rgba(255, 255, 255, 0.7);
    --card-bg: #ffffff;
    --accent-color: #38bdf8;
    --text-dark: #1e293b;
    --text-light: #64748b;
}

body, html {
    margin: 0; padding: 0;
    font-family: 'PingFang SC', sans-serif;
    background-color: var(--primary-bg); /* 背景换成浅灰色，突出白卡片 */
    scroll-behavior: smooth; /* 点击菜单平滑滑动 */
}

/* 新增：导航栏样式 */
nav {
    position: fixed; top: 0; width: 100%; height: 70px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 5%; background: var(--nav-bg);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05);
}
.logo { font-size: 1.5rem; font-weight: 700; color: var(--text-dark); text-decoration: none; }
.nav-links { display: flex; gap: 30px; }
.nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; }

/* 调整：首屏高度改为 80vh */
.hero-section { width: 100%; height: 80vh; position: relative; }
.swiper { width: 100%; height: 100%; }

/* 新增：卡片式布局样式 */
.main-container {
    max-width: 1000px; margin: -60px auto 100px; /* 关键：负边距上移卡片 */
    padding: 0 20px; position: relative; z-index: 20;
}
section {
    background: var(--card-bg); padding: 60px 40px;
    border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    margin-bottom: 40px; border: 1px solid rgba(0,0,0,0.02);
}
h2 { text-align: center; margin-bottom: 30px; }
.social-box { display: flex; justify-content: center; gap: 40px; margin-top: 30px; }
.social-icon { font-size: 2rem; color: var(--text-light); cursor: pointer; transition: 0.3s; }
.social-icon:hover { color: var(--accent-color); transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- 1. 新增：固定导航栏 -->
<nav>
    <a href="#" class="logo">YOUR NAME</a>
    <div class="nav-links">
        <a href="#home">首页</a>
        <a href="#about">关于</a>
        <a href="#portfolio">作品集</a>
        <a href="#ai">AI助手</a>
    </div>
</nav>

<!-- 2. 修改：首屏轮播图 (添加了 ID 以便跳转) -->
<div class="hero-section" id="home">
    <div class="swiper">
        <div class="swiper-wrapper">
            <!-- 保持你之前的图片链接 -->
            <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80"></div>
            <div class="swiper-slide"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80"></div>
        </div>
    </div>
    <div style="position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10; color:white; text-align:center;">
        <h1 style="font-size: 2.5rem; letter-spacing: 4px;">在宁静中沉淀，于未知处破局</h1>
    </div>
</div>

<!-- 3. 新增：卡片主体内容区 -->
<div class="main-container">
    <!-- 关于卡片 -->
    <section id="about">
        <h2>关于我</h2>
        <p style="text-align: center; color: var(--text-light);">这里填写你的个人简介...</p>
        <!-- 将旧代码的社交图标移动到这里 -->
        <div class="social-box">
            <i class="fa-brands fa-weixin social-icon" onclick="openModal('wechat')"></i>
            <i class="fa-regular fa-envelope social-icon" onclick="openModal('email')"></i>
            <i class="fa-brands fa-weibo social-icon" onclick="openModal('weibo')"></i>
        </div>
    </section>

    <!-- 作品集卡片 -->
    <section id="portfolio">
        <h2>作品集</h2>
        <div style="height: 200px; display: flex; align-items: center; justify-content: center; color: #ccc; border: 2px dashed #eee; border-radius: 10px;">
            作品展示模块开发中...
        </div>
    </section>

    <!-- AI助手卡片 -->
    <section id="ai">
        <h2>AI 助手</h2>
        <div style="background: #f1f5f9; padding: 20px; border-radius: 12px; text-align: center; color: #94a3b8;">
            AI 交互功能即将上线
        </div>
    </section>
</div>
</body>
</html>
